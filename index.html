<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micar Tuner — 4x4 configurator</title>
<meta name="description" content="Local sprite-turntable car configurator (original vehicle, original art).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=PT+Sans:wght@400;700&family=PT+Sans+Caption:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23bc1d17'/%3E%3Ccircle cx='10' cy='21' r='4' fill='%23fff'/%3E%3Ccircle cx='22' cy='21' r='4' fill='%23fff'/%3E%3Cpath d='M5 18h22v-5l-4-5H11l-6 5z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app" data-mode="finishes">
  <!-- stage -->
  <div class="stage-wrap" id="stageWrap">
    <div class="stage-bg" id="stageBg"></div>
    <div class="stage" id="stage"><canvas id="car" width="1440" height="900"></canvas></div>
    <div class="drag-hint" id="dragHint">drag to rotate · scroll to zoom</div>
  </div>

  <!-- top-left home -->
  <button class="home-btn" id="homeBtn" title="Garage menu" aria-label="Garage menu">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>
  </button>

  <!-- right dock -->
  <div class="dock-right">
    <button class="pill pill-blue" id="partsUsedBtn"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 4h16v3H4zm0 5h16v3H4zm0 5h16v3H4zm0 5h10v2H4z"/></svg><span>Parts Used</span></button>
    <button class="pill pill-orange" id="buildsBtn"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2 9.5 8.5 2 9l5.5 4.8L5.8 21 12 17.3 18.2 21l-1.7-7.2L22 9l-7.5-.5z"/></svg><span>My Builds</span></button>
    <div class="toggle-stack">
      <button class="toggle" id="tFilters" data-on="false"><span class="led"></span><span class="badge-new">NEW</span><span class="tl">Filters</span><span class="tv">Off</span></button>
      <button class="toggle" id="tBefore" data-on="false"><span class="led"></span><span class="tl tl-small">Before/After</span><span class="tv">Off</span></button>
      <button class="toggle" id="tSounds" data-on="true"><span class="led"></span><span class="tl">Sounds</span><span class="tv">On</span></button>
      <button class="toggle" id="tEngine" data-on="false"><span class="led"></span><span class="tl">ENGINE</span><span class="tv">START</span></button>
      <button class="toggle" id="tFast" data-on="false"><span class="led"></span><span class="help" title="Fast mode skips reflection layers while rotating">?</span><span class="tl">Fast Mode</span><span class="tv">Off</span></button>
      <button class="toggle" id="tTransform" data-on="true"><span class="led"></span><span class="tl">Transform</span><span class="tv">On</span></button>
      <button class="tool-btn" id="saveBtn" title="Save / share / snapshot"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 3h11l3 3v15H5zm2 2v5h8V5zm1 9v5h8v-5z"/></svg></button>
    </div>
  </div>

  <!-- left dock -->
  <div class="dock-left">
    <button class="opt" data-mode="settings" id="optSettings"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h10v2H4zm12 0h4v2h-4zM4 11h4v2H4zm6 0h10v2H10zM4 16h12v2H4zm14 0h2v2h-2z"/></svg><span>Settings</span></button>
    <button class="opt" data-mode="finishes" id="optColors"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2c4 5 7 8.5 7 12a7 7 0 0 1-14 0c0-3.5 3-7 7-12zm0 17a5 5 0 0 0 5-5h-2a3 3 0 0 1-3 3z"/></svg><span>Colors</span></button>
    <button class="opt" data-mode="parts" id="optParts"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 7.5 16.5 3l-2.1 2.1 1.4 1.4-8.3 8.3-1.4-1.4L4 15.5 8.5 20l2.1-2.1-1.4-1.4 8.3-8.3 1.4 1.4z"/></svg><span>Parts</span></button>
  </div>

  <!-- bottom panel -->
  <div class="bottom-panel" id="bottomPanel">
    <!-- COLORS / FINISHES -->
    <section class="panel-mode" data-mode="finishes" id="panelFinishes">
      <div class="col zone-col">
        <div class="header-key">Paintable Zone</div>
        <div class="row">
          <button class="p-i-elem selected" data-zone="exterior">Exterior</button>
          <button class="p-i-elem" data-zone="interior">Interior</button>
          <button class="p-i-elem" data-zone="wheels">Wheels</button>
        </div>
      </div>
      <div class="col part-col">
        <div class="header-key">Selected Part</div>
        <div class="dropdown" id="partDropdown"><button class="dropdown-btn" id="partDropdownBtn">All Components<svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button><ul class="dropdown-list" id="partDropdownList"></ul></div>
      </div>
      <div class="col colors-col">
        <div class="header-key">Colors <b id="colorHex">#bc1d17</b></div>
        <div class="icons-row">
          <button class="icon-elem manip" id="manipBtn" title="Adjust brightness / saturation"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#fff"/></svg></button>
          <button class="icon-elem custom" id="customColorBtn" title="Custom color"><input type="color" id="colorInput" value="#bc1d17"></button>
          <div class="swatches" id="swatches"></div>
          <button class="carousel-arrow" id="swatchNext" aria-label="More colors"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 6l6 6-6 6z"/></svg></button>
        </div>
      </div>
      <div class="col finish-col">
        <div class="header-key">Finish <b id="finishName">Glossy</b></div>
        <div class="icons-row finishes" id="finishes"></div>
      </div>
    </section>

    <!-- PARTS: categories -->
    <section class="panel-mode" data-mode="parts" id="panelParts">
      <div class="cat-strip-wrap" id="catStripWrap">
        <button class="strip-arrow prev" id="catPrev"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15 6l-6 6 6 6z"/></svg></button>
        <div class="cat-strip" id="catStrip"></div>
        <button class="strip-arrow next" id="catNext"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 6l6 6-6 6z"/></svg></button>
      </div>
    </section>
    <!-- PARTS: variants of one category -->
    <section class="panel-mode" data-mode="variants" id="panelVariants">
      <div class="types-tiny">
        <button class="strip-arrow prev" id="tinyPrev"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15 6l-6 6 6 6z"/></svg></button>
        <button class="cat-tile tiny" id="tinyTile" title="Back to all categories"><canvas width="140" height="64"></canvas><p></p></button>
        <button class="strip-arrow next" id="tinyNext"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 6l6 6-6 6z"/></svg></button>
      </div>
      <div class="variant-strip" id="variantStrip"></div>
    </section>

    <!-- SETTINGS -->
    <section class="panel-mode" data-mode="settings" id="panelSettings">
      <div class="slider-group">
        <div class="header-key">Window Tint</div>
        <div class="slider-row"><button class="pm" data-step="-1" data-for="tint">−</button><input type="range" id="tint" min="0" max="1" step="0.02" value="0.25"><button class="pm" data-step="1" data-for="tint">+</button></div>
      </div>
      <div class="slider-group">
        <div class="header-key">Suspension</div>
        <div class="slider-row"><button class="pm" data-step="-1" data-for="suspension">−</button><input type="range" id="suspension" min="-12" max="40" step="1" value="0"><button class="pm" data-step="1" data-for="suspension">+</button></div>
      </div>
      <div class="slider-group">
        <div class="header-key">Zoom Level</div>
        <div class="slider-row"><button class="pm" data-step="-1" data-for="zoom">−</button><input type="range" id="zoom" min="0.6" max="1.8" step="0.02" value="1"><button class="pm" data-step="1" data-for="zoom">+</button></div>
      </div>
      <div class="checks">
        <div class="check"><span class="check-round" id="cWheelNeon"></span><span>Wheel Neon</span><input type="color" class="neon-color" id="wheelNeonColor" value="#ff2fb0" title="Wheel neon color"></div>
        <div class="check"><span class="check-round" id="cCarNeon"></span><span>Car Neon</span><input type="color" class="neon-color" id="carNeonColor" value="#2fd4ff" title="Underglow color"></div>
        <div class="check"><span class="check-round" id="cLights"></span><span>Lights On</span></div>
        <div class="check"><span class="check-round" id="cRock"></span><span>Rock Lights</span></div>
        <div class="check"><span class="check-round active" id="cAuto"></span><span>Auto Rotate</span></div>
      </div>
    </section>

    <!-- FILTERS -->
    <section class="panel-mode" data-mode="filters" id="panelFilters">
      <div class="header-key filters-head">Photo filters</div>
      <div class="filter-strip" id="filterStrip"></div>
    </section>
  </div>

  <!-- overlays -->
  <div class="loader" id="loader"><div class="loader-box"><div class="loader-title">LOADING</div><div class="loader-pct" id="loaderPct">0%</div><div class="loader-bar"><div id="loaderBar"></div></div></div></div>
  <div class="preload-pill" id="preloadPill" hidden>caching frames <b id="preloadPct">0%</b></div>

  <div class="modal" id="modal" hidden><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div class="modal-body" id="modalBody"></div></div></div>
  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
